<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STUCK · an archive by Olga Eilenstein</title>
<style>
:root{}
@font-face{font-family:'OEb';src:url('fonts/ob.woff') format('woff');font-weight:700;font-display:swap}
@font-face{font-family:'OEm';src:url('fonts/om.woff') format('woff');font-weight:500;font-display:swap}
@font-face{font-family:'OEs';src:url('fonts/os.woff') format('woff');font-weight:600;font-display:swap}
:root{
  --ink:#ecebe7; --dim:#77746e; --bg:#000;
  --type:'OEm','Helvetica Neue',Helvetica,Arial,sans-serif;
  --semi:'OEs','Helvetica Neue',Helvetica,Arial,sans-serif;
  --grot:'OEb','Helvetica Neue',Helvetica,Arial,sans-serif;
  --edge:.73; /* where the pole's corner sits, as share of width */
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--type);font-size:12px;overflow-x:hidden;font-feature-settings:'tnum','cv11';-webkit-font-smoothing:antialiased}
/* photocopy grain over everything */
body::after{content:"";position:fixed;inset:-50%;z-index:90;pointer-events:none;opacity:.07;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>")}

/* header */
header{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 4vw 10px;background:#000;border-bottom:1px solid #1c1c1c}
.logo{font-family:var(--semi);font-size:10px;letter-spacing:.2em;line-height:1}
.logo small{display:block;font-family:var(--semi);font-size:8px;color:var(--dim);letter-spacing:.14em;text-transform:uppercase;margin-top:5px}
.toggle{display:flex;gap:2px;font-family:var(--semi);font-size:10px;letter-spacing:.06em;text-transform:uppercase}
.toggle button{text-transform:uppercase;letter-spacing:.06em;background:none;border:1px solid transparent;border-radius:99px;color:var(--dim);font:inherit;cursor:pointer;padding:3px 9px 3px}
.toggle button.on{color:var(--ink);border-color:transparent}
.toggle button.on::before{content:'[ '}.toggle button.on::after{content:' ]'}
.toggle button{font-size:9px!important;padding:3px 4px!important}

/* tape label: text printed on a strip of tape */
.tape{display:inline-block;position:relative;padding:3px 9px 4px;margin:3px 0;color:#0b0b0b;
  font-family:var(--grot);font-weight:500;line-height:1.05;
  background:linear-gradient(180deg,rgba(225,222,212,.86),rgba(205,201,190,.82));
  box-shadow:0 1px 2px rgba(0,0,0,.5);
  clip-path:polygon(0 4%,3% 0,98% 6%,100% 92%,96% 100%,2% 95%)}
.tape.type{font-family:var(--type);font-weight:400}

/* pole fills the screen, small margins */
.poleWrap{position:relative;padding:0 3.5vw}
.pole{position:relative;width:100%;max-width:980px;margin:0 auto;
  background-image:url('pole_tile.jpg');background-size:100% auto;background-repeat:repeat-y}
.pole::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:3;
  background:linear-gradient(90deg,rgba(0,0,0,.75) 0%,rgba(0,0,0,.15) 7%,rgba(0,0,0,0) 30%,rgba(0,0,0,0) 70%,rgba(0,0,0,.25) 73%,rgba(0,0,0,.42) 78%,rgba(0,0,0,.55) 93%,rgba(0,0,0,.85) 100%)}
.pole::after{content:"";position:absolute;left:0;right:0;bottom:0;height:320px;pointer-events:none;z-index:4;background:linear-gradient(transparent,#000)}

/* darkened top of the pole with the intro on it */
.top{position:absolute;left:0;right:0;top:0;height:100vh;height:100lvh;z-index:5;justify-content:flex-end!important;padding-bottom:21vh!important;
  background:linear-gradient(180deg,rgba(0,0,0,.96) 0%,rgba(0,0,0,.88) 45%,rgba(0,0,0,.4) 80%,rgba(0,0,0,0) 100%);
  display:flex;flex-direction:column;justify-content:center;padding:0 7%;pointer-events:none}
.top h1{position:relative;font-family:var(--grot);font-weight:700;font-size:clamp(58px,19vw,170px);line-height:.8;letter-spacing:-.05em;margin:0 0 26px 3%;color:#e4e1da;text-shadow:0 0 1px rgba(228,225,218,.5)}
.top h1 .ov{position:absolute;left:.06em;top:.34em;color:transparent;-webkit-text-stroke:1px rgba(236,235,231,.32);pointer-events:none}
.top h1 .ov2{position:absolute;left:-.02em;top:.02em;color:rgba(236,235,231,.10);transform:translate(3px,-2px);pointer-events:none;mix-blend-mode:screen}
.top .lines{max-width:620px;margin-left:4%}
.no{font-family:var(--semi);font-size:8.5px;letter-spacing:.18em;color:#a8a49c;margin:0 0 22px 4%}
.tp{display:block;height:auto;margin:-2px 0;max-width:none;filter:brightness(.9) contrast(1.02)}
.sig{margin:26px 0 0 4%;font-family:var(--semi);font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:#a8a49c;line-height:1.9}
.code{position:absolute;top:84px;left:7%;font-family:var(--semi);font-size:8.5px;letter-spacing:.1em;color:#8d8a84}
.code.r{left:auto;right:7%;text-align:right}
.xh,.xv{position:absolute;background:rgba(236,235,231,.16)}
.xh{left:0;right:0;top:104px;height:1px}
.xv{top:0;bottom:0;left:calc(var(--edge)*100%);width:1px;background:linear-gradient(rgba(236,235,231,.18),rgba(236,235,231,.18) 70%,transparent)}
.reg{position:absolute;width:14px;height:14px}
.reg::before,.reg::after{content:"";position:absolute;background:rgba(236,235,231,.55)}
.reg::before{left:6.5px;top:0;width:1px;height:14px}.reg::after{top:6.5px;left:0;height:1px;width:14px}
.reg i{position:absolute;inset:3px;border:1px solid rgba(236,235,231,.55);border-radius:50%}
.sheetR{margin-top:34px;margin-left:auto;text-align:right;font-family:var(--grot);font-weight:700;font-size:clamp(13px,3.9vw,22px);line-height:1.08;letter-spacing:-.01em;text-transform:uppercase}
.sheetR .s{font-family:var(--semi);font-size:8.5px;letter-spacing:.12em;color:#8d8a84;margin-bottom:6px}
.sheetR .d{color:#8d8a84}
.pill{display:inline-block;border:1.2px solid currentColor;border-radius:99px;padding:0 .38em .04em;line-height:1.02}
.sheetR .pill{margin-top:2px}
.top .meta{display:none}


/* street details on the pole */
.band{position:absolute;left:0;right:0;z-index:2;pointer-events:none}
.band i{position:absolute;top:0;bottom:0}
.band .bl{left:0;width:calc(var(--edge)*100%);transform:skewY(-2deg);transform-origin:right center;
  background:linear-gradient(180deg,#1a1b1d 0,#55585c 18%,#2b2d30 40%,#121314 60%,#3b3e42 82%,#0d0d0e 100%);box-shadow:0 6px 10px rgba(0,0,0,.6)}
.band .br{right:0;width:calc((1 - var(--edge))*100%);transform:skewY(-4deg);transform-origin:left center;filter:brightness(.6);
  background:linear-gradient(180deg,#1a1b1d 0,#55585c 18%,#2b2d30 40%,#121314 60%,#3b3e42 82%,#0d0d0e 100%);box-shadow:0 6px 10px rgba(0,0,0,.6)}
.band .bl::after,.band .br::after{content:"";position:absolute;inset:0;background:url('pole_tile.jpg') center/200px auto;mix-blend-mode:overlay;opacity:.5}
.bolt{position:absolute;width:16px;height:16px;border-radius:3px;z-index:3;
  background:radial-gradient(circle at 35% 30%,#8c9094,#3a3c3f 55%,#111 100%);box-shadow:0 2px 3px rgba(0,0,0,.7)}
.rust{position:absolute;z-index:1;width:10px;pointer-events:none;mix-blend-mode:multiply;opacity:.75;
  background:linear-gradient(180deg,rgba(120,60,25,.9),rgba(120,60,25,.35) 60%,transparent)}
.plate{position:absolute;z-index:2;background:#7a1f1a;color:#efe9e2;font-family:var(--grot);font-weight:700;letter-spacing:-.01em;
  text-align:center;line-height:1.02;padding:.35em .45em;box-shadow:0 2px 5px rgba(0,0,0,.6);transform-origin:right center}
.plate::after{content:"";position:absolute;inset:0;background:url('pole_tile.jpg') center/220px auto;mix-blend-mode:multiply;opacity:.45}
.residue{position:absolute;z-index:1;pointer-events:none;background:rgba(214,208,194,.38);mix-blend-mode:screen;
  clip-path:polygon(3% 10%,30% 0,55% 8%,80% 2%,100% 22%,94% 60%,100% 88%,70% 100%,40% 92%,12% 100%,0 70%)}
.glue{position:absolute;z-index:1;pointer-events:none;border-radius:40%;background:radial-gradient(ellipse,rgba(255,250,235,.16),rgba(255,250,235,.04) 60%,transparent 70%)}
.pole .grain{position:absolute;inset:0;z-index:3;pointer-events:none;opacity:.22;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='1.4' numOctaves='3'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 1.6 -.3'/></filter><rect width='220' height='220' filter='url(%23n)'/></svg>")}


.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px 14px}
@media(min-width:700px){.grid{grid-template-columns:repeat(5,1fr)}}
.cell{cursor:pointer}
.cell .ic{aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:#0b0b0b;position:relative;overflow:hidden}
.cell .ic img{max-width:84%;max-height:84%;filter:drop-shadow(0 3px 6px rgba(0,0,0,.7))}
.cell .ic .mini{width:76%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:4px;box-shadow:0 3px 6px rgba(0,0,0,.7);overflow:hidden}
.cell .id{font-family:var(--grot);font-size:11px;margin-top:7px;letter-spacing:-.01em}
.cell .ct{font-size:9px;color:var(--dim)}
.cell:active .ic{background:#151515}
body.idx .years,body.idx .proto{display:none}


#map{position:fixed;inset:0;z-index:40;background:#000;display:none;padding:76px 0 0}
#map.on{display:block}
.mapHead{padding:0 4vw}
.mapHead h3{font-family:var(--grot);font-weight:700;font-size:22px;line-height:1;letter-spacing:-.02em}
.mapHead .sub{color:var(--dim);margin:6px 0 10px}
.mapStage{position:absolute;left:0;right:0;top:150px;bottom:0;touch-action:none;cursor:grab;overflow:hidden}
#mapSvg{width:100%;height:100%;display:block}
#land path{fill:#0f0f0f;stroke:#3b3b3b;stroke-width:.6;vector-effect:non-scaling-stroke}
#grat path{fill:none;stroke:#1d1d1d;stroke-width:.6;vector-effect:non-scaling-stroke}
#grat text{display:none}
.pin circle.dot{fill:#ecebe7}
.pin circle.ring{fill:none;stroke:#ecebe7;stroke-width:1;vector-effect:non-scaling-stroke;opacity:.5}
.pin text{fill:#ecebe7;font-family:var(--semi);letter-spacing:.06em;paint-order:stroke;stroke:#000;stroke-width:3px}
.pin{cursor:pointer}
.zoom{position:absolute;right:4vw;bottom:26px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:40px;height:40px;background:#0b0b0b;border:1px solid #2a2a2a;color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:62%;overflow:auto;background:#070707;border-top:1px solid #222;padding:14px 4vw 30px;transform:translateY(100%);transition:transform .35s cubic-bezier(.2,.7,.2,1)}
.sheet.on{transform:none}
.sheetHead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
.sheetHead span{font-family:var(--grot);font-weight:700;font-size:26px;letter-spacing:-.03em}
.sheetHead button{background:none;border:0;color:var(--ink);font:inherit;text-decoration:underline;text-underline-offset:4px;cursor:pointer}
body.map .years,body.map .proto{display:none}

/* decor: gauze, foil, tape, paper left on the glue */
.dec{position:absolute;z-index:1;pointer-events:none;height:auto}
.dec.gz{opacity:.95;filter:sepia(.35) brightness(.92) drop-shadow(1px 2px 1px rgba(0,0,0,.75)) drop-shadow(0 0 3px rgba(0,0,0,.35))}
.dec.fl{z-index:2;filter:contrast(1.45) brightness(1.08) drop-shadow(0 2px 2px rgba(0,0,0,.6))}
.dec.bt{z-index:3;opacity:1;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}
.dec.rs{opacity:.9;filter:sepia(.25) brightness(.95) drop-shadow(0 1px 1px rgba(0,0,0,.45))}
.glueback{position:absolute;inset:0;transform:scaleX(-1);-webkit-mask:var(--m) center/100% 100% no-repeat;mask:var(--m) center/100% 100% no-repeat;
  background:radial-gradient(circle at 30% 40%,rgba(255,255,255,.18) 0 6px,transparent 7px) 0 0/23px 19px,radial-gradient(circle at 70% 60%,rgba(0,0,0,.28) 0 3px,transparent 4px) 0 0/17px 21px,linear-gradient(160deg,#e4e1d8,#bdb9ae);box-shadow:inset 0 0 18px rgba(0,0,0,.25)}
/* card: a sticker with no back photo only lifts at the corner */
.pw{position:absolute;inset:0;clip-path:polygon(0 0,100% 0,100% calc(100% - var(--p,0px)),calc(100% - var(--p,0px)) 100%,0 100%)}
.flapw{position:absolute;right:0;bottom:0;width:var(--p,0px);height:var(--p,0px);filter:drop-shadow(-3px -3px 4px rgba(0,0,0,.55));pointer-events:none}
.flap{position:absolute;inset:0;clip-path:polygon(0 0,100% 0,0 100%);background:linear-gradient(135deg,#9d998f 0%,#d9d5ca 55%,#f1eee6 100%)}
.holder.lift{transition:--p .5s}
/* street map */
#lmap{position:absolute;left:0;right:0;top:150px;bottom:0;display:none;background:#0b0b0b}
#map.leaf .mapStage{display:none}#map.leaf #lmap{display:block}
.maplibregl-ctrl-group{background:#0b0b0b!important;border:1px solid #2a2a2a;border-radius:0!important}
.maplibregl-ctrl-group button{filter:invert(1)}
.maplibregl-ctrl-attrib{background:rgba(0,0,0,.6)!important;color:#555!important;font-size:8px}
.maplibregl-ctrl-attrib a{color:#777!important}
.leaflet-container{background:#0b0b0b!important;font-family:var(--semi)!important}
.leaflet-control-attribution{background:rgba(0,0,0,.6)!important;color:#555!important;font-size:8px!important}
.leaflet-control-attribution a{color:#777!important}
.leaflet-control-zoom a{background:#0b0b0b!important;color:#ecebe7!important;border-color:#2a2a2a!important;border-radius:0!important}
.leaflet-bar{border:1px solid #2a2a2a!important;border-radius:0!important;box-shadow:none!important}
.osm{filter:grayscale(1) invert(1) brightness(.78) contrast(1.15)}
#lmap.far .spin span{display:none}
.spin{position:relative}
.spin i{position:absolute;left:-5px;top:-5px;width:10px;height:10px;border-radius:50%;background:#ecebe7;box-shadow:0 0 0 4px rgba(236,235,231,.18)}
.spin span{position:absolute;left:10px;top:-7px;white-space:nowrap;font-size:9px;letter-spacing:.1em;color:#ecebe7;text-shadow:0 0 3px #000,0 0 3px #000}
.coords a{color:inherit;text-decoration:none;border-bottom:1px solid #444}
/* stickers */
.st{position:absolute;z-index:2;cursor:pointer}
.st .face{position:relative;width:100%;height:100%;overflow:hidden;
  box-shadow:0 1px 1px rgba(0,0,0,.4),0 2px 6px rgba(0,0,0,.35);
  display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:6px}
.st .face::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(160deg,rgba(255,255,255,.14),rgba(0,0,0,.22));mix-blend-mode:multiply}
.st .face::after{content:"";position:absolute;inset:0;pointer-events:none;background:url('pole_tile.jpg') center/260px auto;mix-blend-mode:overlay;opacity:.55}
.st .face{filter:saturate(.72) contrast(.96)}
.st .face .crease{position:absolute;inset:0;pointer-events:none;background:linear-gradient(var(--ca),transparent 46%,rgba(255,255,255,.18) 49%,rgba(0,0,0,.16) 51%,transparent 54%)}
.st.peel .face{clip-path:polygon(0 0,100% 0,100% 78%,82% 100%,0 100%)}
.st.peel::after{content:"";position:absolute;right:0;bottom:0;width:18%;height:22%;
  background:linear-gradient(135deg,#d6d4cc 0 48%,transparent 50%);filter:drop-shadow(-2px -2px 2px rgba(0,0,0,.45));z-index:3}
.st.R{filter:brightness(.72)}
.scrap{position:absolute;z-index:1;background:#cfcbc0;opacity:.5;mix-blend-mode:screen;
  clip-path:polygon(8% 0,60% 6%,100% 30%,88% 90%,40% 100%,0 70%)}
.t-big{font-family:'Arial Black',Impact,sans-serif;font-weight:900;line-height:.95}
.t-thai{font-family:Tahoma,sans-serif;font-weight:700}
.t-small{font-family:Arial,sans-serif;font-size:8px;line-height:1.2}
.qr{width:34%;aspect-ratio:1;margin-top:5px;background:conic-gradient(#000 25%,#fff 0 50%,#000 0 75%,#fff 0) 0 0/25% 25%;border:2px solid #fff;outline:1px solid #000}

/* catalogue label next to each sticker, typed on tape */
.lbl{position:absolute;z-index:5;font-size:9px;pointer-events:none}
.lbl .tape{font-size:9px;padding:2px 6px}

/* wires */
.wires{position:absolute;left:0;z-index:6;pointer-events:none}
.wires canvas{pointer-events:none}
.wireNote{position:absolute;z-index:7;left:7%;right:7%;text-align:center;pointer-events:none}
.wireNote .tape{font-size:clamp(14px,4vw,19px)}

/* margiela-style year label */
.years{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:60;display:flex;gap:14px;
  background:#f1efe9;color:#111;padding:6px 16px;font-family:var(--semi);font-weight:600;letter-spacing:.02em;font-size:10px;
  background-image:radial-gradient(circle,#bdb9b0 1px,transparent 1.5px),radial-gradient(circle,#bdb9b0 1px,transparent 1.5px),radial-gradient(circle,#bdb9b0 1px,transparent 1.5px),radial-gradient(circle,#bdb9b0 1px,transparent 1.5px);
  background-size:4px 4px;background-repeat:no-repeat;background-position:5px 4px,calc(100% - 5px) 4px,5px calc(100% - 4px),calc(100% - 5px) calc(100% - 4px);box-shadow:0 2px 10px rgba(0,0,0,.6)}
.years span{position:relative;padding:0 2px}
.years span.on::after{content:"";position:absolute;left:50%;top:50%;width:2.05em;height:2.05em;transform:translate(-50%,-50%);
  border:1px solid #111;border-radius:50%}

.end{text-align:left;padding:30px 8% 150px}
.end h2{font-family:var(--semi);font-weight:600;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.end p{color:#b9b6ae;margin-top:12px;line-height:1.7;font-size:11px}
.btn{display:inline-block;margin-top:22px;border:0;border-bottom:1px solid var(--ink);border-radius:0;padding:0 0 3px!important;color:var(--ink);background:none;font-family:var(--semi);font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:10px 16px;cursor:pointer}
.proto{position:fixed;bottom:58px;left:4vw;z-index:60;font-size:9px;color:#4a4844}

/* evidence card */
#card{position:fixed;inset:0;z-index:100;background:#000;display:none;overflow:auto}
#card.on{display:block}
.cardIn{max-width:560px;margin:0 auto;padding:64px 20px 60px}
.close{position:fixed;top:14px;right:4vw;z-index:101;background:none;border:1.2px solid var(--ink);border-radius:99px;padding:3px 10px;color:var(--ink);font-family:var(--semi);font-size:10px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.stage{position:relative;cursor:grab;user-select:none;-webkit-user-select:none;height:min(80vw,440px);display:flex;align-items:center;justify-content:center;background:#0b0b0b;overflow:hidden;perspective:900px}
.stage .holder{position:relative;transition:transform .7s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
.stage .holder.flip{transform:rotateY(180deg)}
.stage .side{backface-visibility:hidden;position:absolute;inset:0}
.stage .back{transform:rotateY(180deg);background:
  radial-gradient(circle at 30% 40%,rgba(255,255,255,.14) 0 6px,transparent 7px) 0 0/23px 19px,
  radial-gradient(circle at 70% 60%,rgba(0,0,0,.35) 0 3px,transparent 4px) 0 0/17px 21px,
  url('pole_tile.jpg') center/180px auto,#8e9196;box-shadow:inset 0 0 30px rgba(0,0,0,.6)}
.stage .ruler{position:absolute;bottom:12px;left:12px;right:12px;height:12px;border-top:1px solid #444;
  background:repeating-linear-gradient(90deg,#444 0 1px,transparent 1px 10px)}
.cardId{font-family:var(--grot);font-weight:700;font-size:20px;letter-spacing:-.01em;margin:18px 0 4px}
.meta2 div{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid #1a1a1a;font-size:12px}
.meta2 div span:first-child{color:var(--dim);font-family:var(--semi);font-size:9px;letter-spacing:.1em;text-transform:uppercase}
.meta2 div span:last-child{text-align:right}
.note{margin-top:18px;transform:rotate(-.8deg)}
.details{margin-top:28px;display:grid;gap:18px}
.details img{width:100%;display:block;filter:grayscale(.15) contrast(1.05)}
.details figcaption{font-size:10px;color:var(--dim);margin-top:6px}
.st.real::after{content:"";position:absolute;inset:0;pointer-events:none;background:url('pole_tile.jpg') center/260px auto;mix-blend-mode:overlay;opacity:.38;-webkit-mask:var(--m) center/100% 100% no-repeat;mask:var(--m) center/100% 100% no-repeat}

<body>

<header>

<main>

      </div>

// rendered placeholder stickers (h / w ratio)
const PH={"STK-BKK-0003":.777,"STK-BKK-0021":.521,"STK-BKK-0049":.361,"STK-BKK-0052":1,"STK-BKK-0081":1,"STK-BKK-0097":.401,"STK-BKK-0108":.633,
 "STK-BKK-0112":.620,"STK-CNX-0011":1.001,"STK-HAN-0007":1,"STK-KUL-0003":.986,"STK-SGN-0004":.530,"STK-TYO-0019":1.050};
S.forEach(s=>{if(!s.img&&PH[s.id]){s.img='items/ph/'+s.id+'.webp';s.ar=PH[s.id];s.peel=false;s.ph=true;}});
const WIRES_BEFORE = -1;
// perspective of each face of the pole: the corner points at the viewer, both faces turn away from it
const FACE={L:{skew:-2,sx:.98},R:{skew:-4,sx:.72}}; // wires sit before this sticker

const pole=document.getElementById('pole');
const topBlock=pole.querySelector('.top');
let wiresTop=0,wiresH=0,yearStarts=[];
// height of the screen taken once: on phones the address bar hides while scrolling and changes innerHeight,
// which must not move the stickers
const VH=window.innerHeight;let builtW=0;
function build(){
  builtW=document.documentElement.clientWidth;
  pole.querySelectorAll('.st,.scrap,.lbl,.wires,.wireNote,.band,.bolt,.rust,.plate,.residue,.glue,.grain,.dec').forEach(n=>n.remove());
  const W=pole.clientWidth, E=+getComputedStyle(document.documentElement).getPropertyValue('--edge');
  let y=VH*1.02; yearStarts=[]; const rects=[];
  // masonry on the pole: two lanes on the lit face, one on the shadow face; small stickers fill the gaps,
  // big ones span the whole lit face. Order stays chronological top to bottom.
  const hash=t=>{let h=7;for(const c of String(t))h=(h*31+c.charCodeAt(0))%9973;return h/9973;};
  const lanes=[{x0:W*.05,x1:W*.28,f:'L'},{x0:W*.28,x1:W*.50,f:'L'},{x0:W*.50,x1:E*W-W*.02,f:'L'},{x0:E*W+W*.03,x1:W*.95,f:'R'}];
  const ly=[y,y+W*.04,y+W*.02,y+W*.06];
  const LBL=Math.max(16,W*.034)+14;
  let lastYear=null;
  S.forEach((s,i)=>{
    const wf=(s.cm&&s.cm[0])?Math.min(.62,Math.max(.06,s.cm[0]/POLE_CM)):s.w;
    const base=wf*W, hb=(s.img? wf*s.ar : s.h)*W;
    // candidates: [lanes used, face, scale]
    const cands=[], lw=k=>lanes[k].x1-lanes[k].x0, span=(a,b)=>lanes[b].x1-lanes[a].x0;
    // the shadow face is seen at an angle: only small, wide stickers read well there (or ones marked face R)
    const okR=s.face==='R'||(s.face!=='L'&&s.cm&&s.cm[0]<=4.5&&hb/base<=.85);
    if(okR&&base*.82<=lw(3))cands.push([[3],'R',.82]);
    for(let a=0;a<3;a++)for(let b2=a;b2<3;b2++)if(base<=span(a,b2)&&(b2===a||base>span(a,b2-1)||b2-a===0))cands.push([[...Array(b2-a+1).keys()].map(k=>k+a),'L',1]);
    if(!cands.length)cands.push([[0,1,2],'L',1]);
    let best=null;
    cands.forEach(c=>{const yy=Math.max(...c[0].map(k=>ly[k])),score=yy-(c[1]==='R'?W*.12:0);if(!best||score<best.s-1)best={c,y:yy,s:score};});
    const [ls,face,sc]=best.c, top=best.y, w=base*sc, h=hb*sc;
    const x0=lanes[ls[0]].x0, x1=lanes[ls[ls.length-1]].x1;
    const x=x0+Math.max(0,(x1-x0-w))*hash(s.id);
    if(s.year!==lastYear){yearStarts.push({year:s.year,y:top});lastYear=s.year;}
    const F=FACE[face];
    const e=document.createElement('div');e.className='st '+face+(s.peel?' peel':'')+(s.img?' real':'');
    e.style.cssText=`width:${w}px;height:${h}px;left:${x}px;top:${top}px;`+
      `transform:skewY(${F.skew}deg) scaleX(${F.sx}) rotate(${(s.rot||0)*.35}deg);transform-origin:${face==='R'?'left':'right'} center;`;
    if(s.img)e.style.setProperty('--m','url('+s.img+')');
    e.innerHTML=s.img?'<img src="'+s.img+'" alt="'+s.id+'">':'<div class="face" style="background:'+s.bg+';color:'+s.fg+'">'+s.html+'</div>';
    e.onclick=()=>openCard(i);
    pole.appendChild(e); rects.push([x-10,top-20,x+w+10,top+h+50]);
    const l=document.createElement('div');l.className='lbl';
    l.style.left=x+'px';l.style.top=(top+h+8)+'px';
    l.innerHTML='<img src="tape/'+s.id+'.png" alt="'+s.id+'" style="height:'+Math.max(14,W*.03)+'px;width:auto;display:block">';
    l.style.transform=`skewY(${F.skew}deg) scaleX(${F.sx})`;l.style.transformOrigin=face==='R'?'left center':'right center';
    pole.appendChild(l);
    const next=top+h+LBL+W*(.025+.05*hash(s.id+'g'));
    ls.forEach(k=>ly[k]=next);

  });
  y=Math.max(...ly);

  // ---- street details ----
  const det=document.createElement('div');det.className='grain';pole.appendChild(det);
  const H=y+420, rnd=(a,b)=>a+Math.random()*(b-a);
  const hits=(x1,y1,x2,y2)=>rects.some(r=>x1<r[2]&&x2>r[0]&&y1<r[3]&&y2>r[1])||(y2>wiresTop-60&&y1<wiresTop+wiresH+120);

  const DEC=[];const DEC_OFF=[['gauze1','gz',.46,.477,'L',1.3],['res1','rs',.17,.58,'L',1.9],['foil1','fl',.24,.74,'R',2.4],['btape1','bt',.62,.125,'L',3.1],
    ['res2','rs',.15,.58,'R',3.8],['gauze2','gz',.34,.53,'L',4.6],['foil2','fl',.2,.81,'L',5.4],['res3','rs',.12,.61,'L',6.1],['btape2','bt',.4,.19,'R',6.9],['res1','rs',.13,.58,'L',7.6]];

    const want=VH*(.9+pos*.55);

    else{ // tape and gauze may overlap a sticker edge, never cover the middle

    const F=FACE[face];im.style.cssText=`left:${x}px;top:${yy}px;width:${w}px;transform:skewY(${F.skew}deg) scaleX(${F.sx}) rotate(${dR(-8,8)}deg);transform-origin:${face==='R'?'left':'right'} center`;
    pole.appendChild(im); if(cls!=='bt'&&cls!=='gz')rects.push([x,yy,x+w,yy+h]);
  });
  pole.style.height=(y+420)+'px';
  document.getElementById('years').innerHTML=yearStarts.map(o=>'<span data-y="'+o.year+'">'+o.year+'</span>').join('');

function drawWires(W){
  const vw=document.documentElement.clientWidth, H=wiresH, dpr=Math.min(window.devicePixelRatio||1,2);
  const box=document.createElement('div');box.className='wires';
  const off=pole.getBoundingClientRect().left+window.scrollX;
  box.style.cssText=`top:${wiresTop}px;height:${H}px;left:${-off}px;width:${vw}px`;
  const cv=document.createElement('canvas');cv.width=vw*dpr;cv.height=H*dpr;cv.style.cssText='width:100%;height:100%;display:block';
  box.appendChild(cv);pole.appendChild(box);
  const c=cv.getContext('2d');c.scale(dpr,dpr);c.lineCap='round';
  let seed=7;const R=()=>(seed=(seed*16807)%2147483647)/2147483647;const rr=(a,b)=>a+R()*(b-a);
  const poleL=off-window.scrollX, poleR=poleL+W, cx=(poleL+poleR)/2;
  // a cable: catenary-like sag between two far points, passing the pole
  function cable(y1,y2,sag,w,col,jit){
    const pts=[];for(let t=0;t<=1.0001;t+=.02){const x=-60+t*(vw+120);const y=y1+(y2-y1)*t+sag*4*t*(1-t)+Math.sin(t*9+jit)*1.2;pts.push([x,y]);}
    const path=()=>{c.beginPath();c.moveTo(pts[0][0],pts[0][1]);for(const p of pts)c.lineTo(p[0],p[1]);};
    // shadow on the pole
    c.save();c.globalAlpha=.35;c.strokeStyle='#000';c.lineWidth=w*1.3;c.filter='blur(3px)';c.translate(4,7);path();c.stroke();c.restore();
    c.strokeStyle=col;c.lineWidth=w;path();c.stroke();
    // rubber sheen
    c.save();c.globalAlpha=.22;c.strokeStyle='#cfd6dd';c.lineWidth=Math.max(.6,w*.18);c.translate(0,-w*.28);path();c.stroke();c.restore();
    return pts;
  }
  const cols=['#0b0b0c','#111214','#0d0e10','#16171a','#090909','#1c1d20'];
  const bundles=[];
  for(let b=0;b<4;b++){
    const by=H*(.16+b*.2)+rr(-20,20), tilt=rr(-60,60), sag=rr(40,110), n=Math.round(rr(9,20)), spread=rr(16,34);
    const pts=[];
    for(let i=0;i<n;i++){const o=(i/n-.5)*spread+rr(-3,3);
      const col=R()<.08?'#8d9096':(R()<.06?'#3d4a5c':cols[Math.floor(R()*cols.length)]);
      pts.push(cable(by+o-tilt/2,by+o+tilt/2,sag+rr(-12,12),rr(2.5,8),col,rr(0,6)));}
    bundles.push({by,tilt,sag,spread});
    // zip ties along the bundle
    for(let k=0;k<4;k++){const t=rr(.15,.85),x=-60+t*(vw+120),y=by-tilt/2+tilt*t+sag*4*t*(1-t);
      c.save();c.translate(x,y);c.rotate(rr(-.2,.2));c.fillStyle=R()<.5?'#0a0a0a':'#d9d6cf';c.globalAlpha=.9;c.fillRect(-2.5,-spread*.75,5,spread*1.5);c.restore();}
  }
  // slack coils hanging next to the pole
  for(let k=0;k<3;k++){
    const x=cx+rr(-W*.35,W*.35), y=H*rr(.3,.7), r=rr(28,60);
    for(let j=0;j<7;j++){
      c.save();c.translate(x+rr(-5,5),y+rr(-4,8));c.rotate(rr(-.4,.4));
      c.beginPath();c.ellipse(0,0,r*rr(.9,1.2),r*rr(.75,1),0,0,Math.PI*2);
      c.globalAlpha=.35;c.strokeStyle='#000';c.lineWidth=7;c.filter='blur(3px)';c.translate(4,6);c.stroke();c.filter='none';c.translate(-4,-6);
      c.globalAlpha=1;c.strokeStyle=cols[j%cols.length];c.lineWidth=rr(3,5.5);c.stroke();
      c.globalAlpha=.2;c.strokeStyle='#cfd6dd';c.lineWidth=1;c.stroke();c.restore();
    }
    // tie holding the coil
    c.fillStyle='#0a0a0a';c.fillRect(x-4,y-r*.9,8,r*.5);
  }

  if(m==='index')renderIndex(); if(m==='map'&&!mapBuilt){const gl=document.createElement('canvas').getContext('webgl2')||document.createElement('canvas').getContext('webgl');(gl?buildVector:buildLeaflet)();}}
modes.pole.onclick=()=>setMode('pole');modes.map.onclick=()=>setMode('map');modes.index.onclick=()=>setMode('index');
document.getElementById('submitBtn').onclick=()=>{document.getElementById('submitMsg').style.display='block'};
function setCount(){const cs=new Set(S.map(s=>s.city).filter(c=>c!=='to be added')),ys=S.map(s=>s.year);
const y0=Math.min(...ys),y1=Math.max(...ys);document.getElementById('count').innerHTML='Olga Eilenstein<br>'+(y0===y1?y0:y0+' / '+y1)+' · '+cs.size+(cs.size===1?' city':' cities')+' · '+S.length+(S.length===1?' item':' items');}

// load the real archive, newest first, then start
fetch('items.json?v='+Date.now()).then(r=>r.ok?r.json():[]).catch(()=>[]).then(real=>{
  if(!SHOW_PLACEHOLDERS)S.length=0;
  (real||[]).slice().reverse().forEach(it=>{ if(!S.some(s=>s.id===it.id))S.unshift(it); });
  S.forEach(s=>{ if(s.lat!=null&&s.lon!=null&&s.city&&!CITY[s.city])CITY[s.city]=[s.lat,s.lon]; });
  // chronological: the newest peel at the top, the deeper the older; no date sinks to the bottom of its year
  const dkey=s=>{const m=String(s.date||'').match(/(\d{1,2})\.(\d{1,2})\.(\d{4})/);return m?+m[3]*10000+ +m[2]*100+ +m[1]:(+s.year||0)*10000;};
  S.forEach((s,i)=>s._i=i); S.sort((a,b)=>dkey(b)-dkey(a)||a._i-b._i);
  S.forEach(s=>{const m=String(s.date||'').match(/(\d{4})$/); if(m)s.year=+m[1];});
  setCount(); build();
  const h=decodeURIComponent(location.hash.slice(1)); const k=S.findIndex(s=>s.id===h); if(k>=0)openCard(k);
});
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(document.documentElement.clientWidth!==builtW)build();},200)});
</script>
