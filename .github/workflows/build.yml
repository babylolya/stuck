name: archive
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: archive
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Anything new from the bot?
        id: inbox
        run: |
          if [ -d inbox ] && [ -n "$(ls -A inbox 2>/dev/null)" ]; then echo "new=1" >> $GITHUB_OUTPUT; fi
      - uses: actions/setup-python@v5
        if: steps.inbox.outputs.new == '1'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - uses: actions/cache@v4
        if: steps.inbox.outputs.new == '1'
        with:
          path: ~/.u2net
          key: u2net-isnet
      - name: Cut backgrounds and add stickers
        if: steps.inbox.outputs.new == '1'
        run: |
          pip install -r tools/requirements.txt
          python tools/process.py
          git config user.name "stuck-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "archive: new stickers [skip ci]" || true
          git pull --rebase origin main
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Tell the bot
        if: steps.inbox.outputs.new == '1'
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          SITE_URL: https://stuck-archive.pages.dev
        run: python tools/notify.py
